  header { flex: none; background: var(--brand); color: #fff; padding: 6.5mm 11mm 6.5mm 11mm; position: relative; min-height: 56mm; }

  header h1 em { display: block; }

  header p { margin-top: 2mm; font-size: 11.5pt; opacity: .92; max-width: 140mm; line-height: 1.45; }

  h2 { font-size: 15pt; font-weight: 700; color: var(--brand); display: flex; align-items: center; gap: 2.5mm; }

  .dialog .site { font-size: 8.5pt; color: var(--muted); margin-top: 1mm; }
  .dialog .btns { display: grid; grid-template-columns: 1fr 1.25fr; gap: 2mm; margin-top: 3mm; }

  .dialog .no { background: #eef0f5; color: #8b93a8; text-decoration: line-through; }
  .dialog .yes { background: var(--ok); color: #fff; outline: 1.2mm solid rgba(30,142,90,.3); }
  .dialog .mark { position: absolute; top: -3.5mm; right: -2mm; width: 7mm; height: 7mm; border-radius: 50%; color: #fff; font-size: 11pt; line-height: 7mm; }
  .dialog .no .mark { background: var(--red); }
  .dialog .yes .mark { background: var(--brand); }

  /* ถ้ากด "ไม่อนุญาต" ไปแล้ว: 2 คอลัมน์ */

  .card { border: 0.5mm solid var(--line); border-radius: 5mm; padding: 3.5mm 5mm 4mm; }
  .card h3 { font-size: 14pt; font-weight: 700; display: flex; align-items: center; gap: 2mm; padding-bottom: 2.5mm; border-bottom: 0.4mm dashed var(--line); }
  .card h3 .tag { font-size: 9.5pt; font-weight: 600; color: var(--muted); }
  .card h3 svg { width: 7mm; height: 7mm; flex: none; }
  ol.steps { list-style: none; margin-top: 2.5mm; display: flex; flex-direction: column; gap: 2.2mm; }
  ol.steps li { display: grid; grid-template-columns: 7mm 1fr; gap: 2mm; font-size: 11.5pt; line-height: 1.4; }
  ol.steps li .k { width: 7mm; height: 7mm; border-radius: 50%; background: var(--brand); color: #fff; font-weight: 700; font-size: 10.5pt; display: flex; align-items: center; justify-content: center; }
  ol.steps li.done .k { background: var(--ok); }
  ol.steps li.done { font-weight: 700; color: var(--ok); }
  .chip { display: inline-block; background: var(--sky); color: var(--brand); border-radius: 1.6mm; padding: 0 1.6mm; font-weight: 700; white-space: nowrap; }
  .card .gps { margin-top: 3mm; background: #fff7dc; border-radius: 3mm; padding: 2.5mm 3mm; font-size: 10.5pt; line-height: 1.4; }
  .card .gps b { color: #7a5600; }

  .tip { border-radius: 4mm; padding: 3mm 4mm; background: var(--paper); font-size: 10.5pt; line-height: 1.4; }
  .tip b { display: block; font-size: 12pt; color: var(--brand); margin-bottom: 1mm; }

  .tip.fix b { color: var(--red); }
  .tip .btn { display: inline-block; margin-top: 1.5mm; border: 0.5mm solid #c9d6f2; background: #fff; color: var(--brand); border-radius: 2.5mm; padding: 1mm 2.5mm; font-weight: 700; }

  footer { flex: none; margin-top: auto; background: var(--paper); border-top: 0.5mm solid var(--line); padding: 4mm 11mm; display: grid; grid-template-columns: 27mm 1fr; gap: 5mm; align-items: center; }

  footer .u { font-size: 12pt; font-weight: 600; margin-top: 1mm; letter-spacing: .1mm; }
  footer .s { font-size: 10pt; color: var(--muted); margin-top: 1.5mm; line-height: 1.4; }

  .my .card .gps { font-size: 9.5pt; line-height: 1.55; }
  .my .tip { font-size: 9pt; line-height: 1.55; padding: 3mm 3.5mm; }
  .my .tip b { font-size: 10.5pt; }
  .my footer .t { font-size: 11.5pt; }
  .my footer .s { font-size: 9pt; line-height: 1.55; }

        <div class="card"><h3>${ICON_ANDROID}${t.and} <span class="tag">${t.andTag}</span></h3>${steps(t.andSteps, t.andDone)}<div class="gps">${t.andGps}</div></div>
        <div class="card"><h3>${ICON_APPLE}${t.ios} <span class="tag">${t.iosTag}</span></h3>${steps(t.iosSteps, t.iosDone)}<div class="gps">${t.iosGps}</div></div>
      </div>
      <div class="tips">
        <div class="tip"><b>${t.t1h}</b>${t.t1}</div>
        <div class="tip"><b>${t.t2h}</b>${t.t2}</div>
        <div class="tip fix"><b>${t.t3h}</b>${t.t3}<br><span class="btn">🕒 ${t.t3b}</span></div>
      </div>
    </main>
    <footer>
      <div class="qr">${qr}</div>
      <div><div class="t">${t.ft}</div><div class="u">pull-operation-wha.vercel.app/attendance</div><div class="s">${t.fs}</div></div>
    </footer>
  </section>`;
}

const qr = typeof qrcode === "function" ? qrSvg() : '<div style="font-size:8pt;padding:2mm">QR</div>';
document.getElementById("root").innerHTML = page(T.th, qr) + page(T.my, qr);
</script>
