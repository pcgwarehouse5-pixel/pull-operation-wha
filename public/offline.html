<!doctype html>
<html lang="th">
<head>

  <title>ไม่มีการเชื่อมต่อ · WHA Workforce</title>
  <style>
    html, body { margin: 0; height: 100%; }

           font-family: "Leelawadee UI", Tahoma, "Noto Sans Thai", sans-serif; padding: 24px; box-sizing: border-box; }
    .card { max-width: 360px; width: 100%; background: #fff; border-radius: 24px; padding: 28px 24px; text-align: center;

    h1 { font-size: 22px; margin: 16px 0 8px; color: #1b2a5c; }
    p { font-size: 16px; line-height: 1.6; color: #5a6482; margin: 0 0 20px; }

</head>
<body>

    <img src="/icons/icon-192.png" alt="WHA Workforce">

    <p>ตรวจสอบ Wi-Fi หรือเน็ตมือถือ แล้วกดลองใหม่</p>
    <button type="button" onclick="location.reload()">ลองใหม่</button>
    <p class="my">အင်တာနက် ချိတ်ဆက်မှု မရှိပါ · ပြန်လည်ကြိုးစားပါ</p>
